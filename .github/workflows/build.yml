name: Build Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.board.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: ai_thinker
            target: esp32
            sdkconfig: boards/ai_thinker.sdkconfig
          - name: m5cam_a
            target: esp32
            sdkconfig: boards/m5cam_a.sdkconfig
          - name: m5cam_b
            target: esp32
            sdkconfig: boards/m5cam_b.sdkconfig
          - name: esp_eye
            target: esp32
            sdkconfig: boards/esp_eye.sdkconfig
          - name: esp32s3_eye
            target: esp32s3
            sdkconfig: boards/esp32s3_eye.sdkconfig

    container:
      image: espressif/idf:v5.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Merge sdkconfig and build
        run: |
          # Board overrides take priority; prepend so base defaults fill remaining gaps
          cat ${{ matrix.board.sdkconfig }} sdkconfig.defaults > sdkconfig.defaults.merged
          mv sdkconfig.defaults.merged sdkconfig.defaults
          . $IDF_PATH/export.sh
          idf.py --no-ccache -D IDF_TARGET=${{ matrix.board.target }} build

      - name: Package artifacts
        run: |
          BOARD=${{ matrix.board.name }}
          mkdir -p dist
          cp build/bootloader/bootloader.bin          dist/bootloader.bin
          cp build/partition_table/partition-table.bin dist/partition-table.bin
          cp build/metermonitor.bin                   dist/metermonitor.bin
          cp build/flasher_args.json                  dist/flasher_args.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board.name }}
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build release archives
        run: |
          mkdir -p release
          for board in ai_thinker m5cam_a m5cam_b esp_eye esp32s3_eye; do
            dir="artifacts/firmware-${board}"
            if [ -d "$dir" ]; then
              zip -j "release/metermonitor-${board}.zip" "$dir"/*
            fi
          done
          cp nvs_schema.csv release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
